<!DOCTYPE html>
<html>
<head>
<title>Galette Complete — Microdata Test</title>
</head>
<body>
<div itemscope itemtype="https://schema.org/Recipe">
  <h1 itemprop="name">Galette Complète</h1>
  <span itemprop="recipeYield">2 galettes</span>
  <h2>Ingredients</h2>
  <ul>
    <li itemprop="recipeIngredient">1 buckwheat galette</li>
    <li itemprop="recipeIngredient">1 egg</li>
    <li itemprop="recipeIngredient">60 g gruyère, grated</li>
    <li itemprop="recipeIngredient">2 slices ham</li>
  </ul>
  <h2>Instructions</h2>
  <ol itemprop="recipeInstructions">
    <li>Warm the galette on a hot plate.</li>
    <li>Crack the egg in the middle.</li>
    <li>Add ham and cheese, fold and serve.</li>
  </ol>
</div>
</body>
</html>
