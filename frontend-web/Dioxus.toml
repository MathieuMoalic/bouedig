[application]
name = "frontend-web"
default_platform = "web"

# The tab title lives in index.html. dx *appends* this value to the static
# <title> when rendering the bundle, so keep it empty to avoid duplications
# like "BouedigBouedig" or "Bouedigdioxus | ⛺".
[web.app]
title = ""

[web.watcher]
reload_html = true
index_on_404 = true

# Forward /api/* from the dev server to the backend started by `just dev-web`.
# The target port must match BOUEDIG_PORT in the repo-root .env (default 3000).
[[web.proxy]]
backend = "http://127.0.0.1:3000/api"
